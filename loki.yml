auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# Глобальные настройки для всех компонентов монолита
common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory # Все кольца (ingester, distributor) хранятся только в памяти

# Настройки приема логов
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_retain_period: 30s

# ОТКЛЮЧАЕМ CONSUL ДЛЯ ДИСТРИБЬЮТОРА
distributor:
  ring:
    kvstore:
      store: inmemory

# ОТКЛЮЧАЕМ CONSUL ДЛЯ ПЛАНИРОВЩИКА (SCHEDULER)
frontend:
  scheduler_address: ""

# Локальный компактор
compactor:
  working_directory: /tmp/loki/compactor
  compaction_interval: 10m
  retention_enabled: false

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false