server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml # Файл, где promtail отмечает, до куда он дочитал логи

clients:
  - url: http://loki:3100/loki/api/v1/push # Куда сливать логи

scrape_configs:
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock # Подключаемся к сокету докера, чтобы видеть контейнеры
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container